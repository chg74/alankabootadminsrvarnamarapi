<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>العنكبوت ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{min-height:100vh;background:#050510;color:#fff;padding:20px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 800px 600px at 15% 10%,rgba(139,92,246,.25),transparent 55%),radial-gradient(ellipse 700px 500px at 85% 90%,rgba(0,255,136,.18),transparent 55%),radial-gradient(ellipse 900px 700px at 50% 50%,rgba(59,130,246,.12),transparent 60%);}
.app{width:100%;max-width:640px;margin:auto;position:relative;}

.logo-wrap{display:flex;justify-content:center;margin-bottom:6px;}
.logo-img{width:70px;height:70px;border-radius:18px;object-fit:contain;background:rgba(255,255,255,.04);border:1px solid rgba(0,255,136,.3);padding:8px;box-shadow:0 0 30px rgba(0,255,136,.35);}
.logo{text-align:center;color:#fff;font-size:24px;font-weight:900;letter-spacing:1px;margin-top:12px;}
.logo span{color:#00ff88;text-shadow:0 0 15px rgba(0,255,136,.6);}
.sub{text-align:center;color:#6d6d8a;font-size:12px;margin:4px 0 22px;font-weight:600;}

.card{background:linear-gradient(180deg,rgba(18,18,32,.95),rgba(10,10,22,.95));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,136,.5),transparent);}
.title{color:#00ff88;font-weight:800;font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.title::before{content:'';width:4px;height:16px;background:linear-gradient(180deg,#00ff88,#8b5cf6);border-radius:4px;}
label{display:block;color:#9a9ab5;font-size:12px;margin-bottom:7px;font-weight:700;}
input,select{width:100%;background:#0a0a18;border:1.5px solid #232338;color:#fff;padding:14px;border-radius:13px;outline:none;margin-bottom:13px;font-size:14px;font-weight:600;transition:.2s;}
input:focus,select:focus{border-color:#00ff88;box-shadow:0 0 0 3px rgba(0,255,136,.1);}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s;}
.green{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#001a0e;box-shadow:0 8px 24px rgba(0,255,136,.35);}
.green:active{transform:scale(.98);}
.dark{background:#0b110e;color:#aaa;border:1px solid #1d3028;}
.red{background:linear-gradient(135deg,#3a0d12,#210909);color:#ff6868;border:1px solid #572020;}
.msg{min-height:18px;text-align:center;font-size:12px;margin-top:10px;font-weight:700;}
.ok{color:#00ff88;}
.err{color:#ff5555;}
#adminArea{display:none !important;}
#adminArea.unlocked{display:block !important;}

.status{display:flex;align-items:center;gap:7px;color:#00ff88;font-size:11px;margin-bottom:14px;font-weight:700;}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;animation:blink 1.5s infinite;}
@keyframes blink{50%{opacity:.4}}

.codeBox{margin-top:16px;padding:20px;border-radius:16px;background:linear-gradient(135deg,rgba(0,255,136,.12),rgba(139,92,246,.08));border:1.5px solid rgba(0,255,136,.5);text-align:center;display:none;}
.codeBox.show{display:block;animation:pop .35s;}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.codeBox .lbl{color:#9a9ab5;font-size:11px;margin-bottom:10px;font-weight:700;}
.codeBox .cd{color:#00ff88;font-size:38px;font-weight:900;letter-spacing:8px;font-family:'Courier New',monospace;direction:ltr;text-shadow:0 0 25px rgba(0,255,136,.7);}

.channel{padding:16px;margin-top:10px;background:linear-gradient(135deg,rgba(20,20,35,.95),rgba(12,12,22,.95));border:1px solid rgba(255,255,255,.08);border-radius:16px;display:flex;flex-direction:column;gap:10px;}
.channel.off{opacity:.5;border-color:rgba(255,60,60,.3);}
.channel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.channel-code{font-family:'Courier New',monospace;font-weight:900;color:#00ff88;font-size:20px;letter-spacing:4px;direction:ltr;background:rgba(0,255,136,.1);padding:8px 14px;border-radius:10px;border:1px solid rgba(0,255,136,.35);text-shadow:0 0 12px rgba(0,255,136,.4);}
.channel-status{font-size:10px;padding:5px 12px;border-radius:100px;font-weight:800;}
.channel-status.on{background:rgba(0,255,136,.15);color:#00ff88;border:1px solid rgba(0,255,136,.3);}
.channel-status.off{background:rgba(255,60,60,.12);color:#ff6868;border:1px solid rgba(255,60,60,.3);}
.channel-name{color:#fff;font-weight:800;font-size:14px;}
.channel-url{direction:ltr;text-align:left;color:#6d6d8a;font-size:10.5px;word-break:break-all;background:#0a0a18;padding:9px 11px;border-radius:9px;border:1px solid #1a1a2e;font-family:monospace;}
.channel-btns{display:flex;gap:8px;flex-wrap:wrap;}
.channel-btns button{flex:1;min-width:80px;padding:10px;font-size:12px;border-radius:10px;}
.empty{color:#5a5a75;text-align:center;padding:20px;font-size:12px;font-weight:600;}
.badge{display:inline-block;background:rgba(0,255,136,.15);color:#00ff88;font-size:10px;padding:3px 9px;border-radius:6px;font-weight:800;margin-inline-start:6px;}
</style>
</head>
<body>

<div class="app">

<!-- ═══ شاشة تسجيل الدخول (اللي بتظهر دايماً) ═══ -->
<div id="loginScreen">

<div class="logo-wrap">
<img class="logo-img" src="https://i.postimg.cc/xT8rcsT1/file-000000008bb4820ebcd371e64fff0469.png" alt="">
</div>
<div class="logo">العنكبوت <span>ADMIN</span></div>
<div class="sub">🔒 لوحة تحكم محمية — دخول للأدمن فقط</div>

<div class="card">
<div class="title">دخول لوحة الأدمن</div>

<label>كود الأدمن</label>
<input id="adminCode" type="password" placeholder="أدخل كود الأدمن" autocomplete="off" spellcheck="false">

<button class="green" id="enterAdmin">🔓 دخول لوحة التحكم</button>
<div class="msg err" id="loginMsg"></div>
</div>

</div>

<!-- ═══ لوحة التحكم (مخفية، بتظهر بعد الدخول) ═══ -->
<div id="adminArea">

<div class="logo-wrap">
<img class="logo-img" src="https://i.postimg.cc/xT8rcsT1/file-000000008bb4820ebcd371e64fff0469.png" alt="">
</div>
<div class="logo">العنكبوت <span>ADMIN</span></div>
<div class="sub">LIVE STREAM CONTROL PANEL</div>

<div class="card">
<div class="status"><span class="dot"></span> متصل بلوحة التحكم</div>
<div class="title">➕ إضافة قناة جديدة</div>

<label>رابط البث</label>
<input id="chUrl" type="text" dir="ltr" placeholder="http://example.com/live.m3u8">

<label>اسم القناة (اختياري)</label>
<input id="chName" type="text" placeholder="مثال: beIN Sports 1">

<label>نوع المشغل</label>
<select id="chType">
<option value="auto">AUTO — تلقائي</option>
<option value="hls">HLS — M3U8</option>
<option value="mp4">MP4</option>
<option value="iframe">IFRAME</option>
</select>

<button class="green" id="addChannel">✨ إنشاء قناة وكود</button>
<div class="msg" id="chMsg"></div>

<div class="codeBox" id="newCodeBox">
<div class="lbl">✓ تم إنشاء القناة — الكود الخاص بها:</div>
<div class="cd" id="newCode">------</div>
<button class="dark" style="margin-top:16px;" id="copyNewCode">📋 نسخ الكود</button>
</div>
</div>

<div class="card">
<div class="title">📺 القنوات المضافة <span class="badge" id="chCount">0</span></div>
<div id="channelsList"><div class="empty">جاري التحميل...</div></div>
</div>

<div class="card">
<button class="red" id="logout">🚪 تسجيل الخروج</button>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAUc2C9hG9VE7RECiW19QXjNZqVH96sFE",
authDomain: "zezo-59a8d.firebaseapp.com",
databaseURL: "https://zezo-59a8d-default-rtdb.firebaseio.com",
projectId: "zezo-59a8d",
storageBucket: "zezo-59a8d.firebasestorage.app",
messagingSenderId: "49183098248",
appId: "1:49183098248:web:37e3fb16744042a1bb263d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ═══════════════════════════════════════════════
   🔒 كود الأدمن — هو اللي بيحمي اللوحة
   ═══════════════════════════════════════════════ */
const ADMIN_CODE = "ANKABOOT_ADMIN_2026_CHANGE_ME";

/* ─── العناصر ─── */
const loginScreen = document.getElementById("loginScreen");
const adminArea = document.getElementById("adminArea");
const adminCode = document.getElementById("adminCode");
const loginMsg = document.getElementById("loginMsg");
const chUrl = document.getElementById("chUrl");
const chName = document.getElementById("chName");
const chType = document.getElementById("chType");
const chMsg = document.getElementById("chMsg");
const channelsList = document.getElementById("channelsList");
const chCount = document.getElementById("chCount");
const newCodeBox = document.getElementById("newCodeBox");
const newCode = document.getElementById("newCode");

/* ═══════════════════════════════════════════════
   🔐 جلسة الأدمن
   ═══════════════════════════════════════════════ */
let adminSession = false;

try{
    adminSession = sessionStorage.getItem("ank_admin") === "YES";
}catch(e){}

function showLoginScreen(){
    loginScreen.style.display = "block";
    adminArea.classList.remove("unlocked");
    adminArea.style.setProperty("display", "none", "important");
    /* تنظيف أي بيانات في اللوحة */
    chUrl.value = "";
    chName.value = "";
    chMsg.textContent = "";
    newCodeBox.classList.remove("show");
}

function showAdminPanel(){
    loginScreen.style.display = "none";
    adminArea.classList.add("unlocked");
}

/* لو مسجل دخول → افتح اللوحة، وإلا اعرض الشاشة */
if(adminSession === true){
    showAdminPanel();
} else {
    showLoginScreen();
}

/* ═══════════════════════════════════════════════
   🔓 الدخول
   ═══════════════════════════════════════════════ */
function tryLogin(){
    const entered = String(adminCode.value || "").trim();

    if(!entered){
        loginMsg.textContent = "❌ اكتب كود الأدمن أولاً";
        return;
    }

    if(entered === ADMIN_CODE){
        /* ✅ كود صح */
        try{
            sessionStorage.setItem("ank_admin", "YES");
        }catch(e){}
        adminSession = true;
        loginMsg.textContent = "";
        adminCode.value = "";
        showAdminPanel();
    } else {
        /* ❌ كود غلط */
        loginMsg.textContent = "❌ كود الأدمن غير صحيح";
        adminCode.value = "";
        adminCode.focus();
        /* تأثير اهتزاز بسيط */
        loginMsg.animate(
            [{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],
            {duration:200}
        );
    }
}

document.getElementById("enterAdmin").addEventListener("click", tryLogin);

adminCode.addEventListener("keydown", e=>{
    if(e.key === "Enter") tryLogin();
});

/* ═══════════════════════════════════════════════
   🚪 تسجيل الخروج
   ═══════════════════════════════════════════════ */
document.getElementById("logout").addEventListener("click", ()=>{
    try{ sessionStorage.removeItem("ank_admin"); }catch(e){}
    adminSession = false;
    adminCode.value = "";
    loginMsg.textContent = "";
    showLoginScreen();
    /* اختياري: اخرج من الـ listener */
    try{ if(adminCode) adminCode.focus(); }catch(e){}
});

/* ═══════════════════════════════════════════════
   🎲 توليد كود قصير فريد
   ═══════════════════════════════════════════════ */
function generateShortCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let r = "";
    for(let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
    return r;
}

async function getUniqueCode(){
    for(let attempt = 0; attempt < 30; attempt++){
        const code = generateShortCode();
        const snap = await get(ref(db, "channels/" + code));
        if(!snap.exists()) return code;
    }
    throw new Error("تعذر توليد كود فريد");
}

/* ═══════════════════════════════════════════════
   ➕ إنشاء قناة + كود
   ═══════════════════════════════════════════════ */
document.getElementById("addChannel").addEventListener("click", async ()=>{

    if(adminSession !== true){
        alert("⛔ يجب تسجيل الدخول أولاً");
        showLoginScreen();
        return;
    }

    const url = chUrl.value.trim();
    const name = chName.value.trim();
    const type = chType.value;

    if(!url){
        chMsg.className = "msg err";
        chMsg.textContent = "اكتب رابط البث";
        return;
    }

    try{ new URL(url); }
    catch{
        chMsg.className = "msg err";
        chMsg.textContent = "الرابط غير صحيح";
        return;
    }

    chMsg.className = "msg";
    chMsg.textContent = "جاري الإنشاء...";

    try{
        const code = await getUniqueCode();

        await set(ref(db, "channels/" + code), {
            url: url,
            name: name || ("قناة " + code),
            type: type,
            active: true,
            createdAt: Date.now()
        });

        newCode.textContent = code;
        newCodeBox.classList.add("show");

        chMsg.className = "msg ok";
        chMsg.textContent = "تم إنشاء القناة بنجاح ✓";

        chUrl.value = "";
        chName.value = "";
        chType.value = "auto";

        try{
            await navigator.clipboard.writeText(code);
            chMsg.textContent = "✓ تم الإنشاء ونسخ الكود تلقائياً";
        }catch(e){}

    } catch(error){
        console.error(error);
        chMsg.className = "msg err";
        chMsg.textContent = "حدث خطأ: " + error.message;
    }

});

document.getElementById("copyNewCode").addEventListener("click", async ()=>{
    try{
        await navigator.clipboard.writeText(newCode.textContent);
        alert("✓ تم نسخ الكود: " + newCode.textContent);
    }catch{
        alert("تعذر النسخ — انسخه يدوياً: " + newCode.textContent);
    }
});

/* ═══════════════════════════════════════════════
   📺 عرض القنوات (محمي)
   ═══════════════════════════════════════════════ */
onValue(ref(db, "channels"), snapshot=>{

    /* ⛔ لو مش الأدمن، متعرضش حاجة */
    if(adminSession !== true) return;

    const data = snapshot.val();
    channelsList.innerHTML = "";

    if(!data){
        channelsList.innerHTML = '<div class="empty">لا توجد قنوات — أضف قناة من الأعلى</div>';
        chCount.textContent = "0";
        return;
    }

    const entries = Object.entries(data).sort((a,b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
    chCount.textContent = entries.length;

    entries.forEach(([code, item])=>{

        const div = document.createElement("div");
        div.className = "channel" + (item.active ? "" : " off");

        div.innerHTML = `
<div class="channel-head">
<div class="channel-code">${code}</div>
<span class="channel-status ${item.active ? "on" : "off"}">${item.active ? "● مفعّل" : "○ موقوف"}</span>
</div>
<div class="channel-name">${item.name || "بدون اسم"}</div>
<div class="channel-url">${item.url}</div>
<div class="channel-btns">
<button class="dark" onclick="copyCode('${code}')">📋 نسخ</button>
<button class="${item.active ? "dark" : "green"}" onclick="toggleCode('${code}', ${item.active})">${item.active ? "⏸ إيقاف" : "▶ تفعيل"}</button>
<button class="red" onclick="deleteCode('${code}')">🗑 حذف</button>
</div>
`;

        channelsList.appendChild(div);
    });

});

/* ═══════════════════════════════════════════════
   🛠 العمليات
   ═══════════════════════════════════════════════ */
window.copyCode = async function(code){
    if(adminSession !== true){ alert("⛔ يجب تسجيل الدخول"); return; }
    try{
        await navigator.clipboard.writeText(code);
        alert("✓ تم نسخ الكود: " + code);
    }catch{
        alert("تعذر النسخ — الكود: " + code);
    }
};

window.toggleCode = async function(code, current){
    if(adminSession !== true){ alert("⛔ يجب تسجيل الدخول"); return; }
    try{
        await update(ref(db, "channels/" + code), { active: !current });
    }catch(e){ console.error(e); }
};

window.deleteCode = async function(code){
    if(adminSession !== true){ alert("⛔ يجب تسجيل الدخول"); return; }
    if(!confirm("⚠️ هل تريد حذف القناة " + code + " نهائياً؟\n\nلن يعمل هذا الكود عند أي مستخدم.")) return;
    try{
        await remove(ref(db, "channels/" + code));
    }catch(e){ console.error(e); }
};

/* ═══════════════════════════════════════════════
   🛡 حماية إضافية — منع الاتصال من لوحة التحكم بدون جلسة
   ═══════════════════════════════════════════════ */
/* لو أي حد حاول يشوف الـ adminArea من الـ console */
Object.defineProperty(window, "_adminArea", {
    get(){ return adminSession ? "unlocked" : "locked"; }
});

/* كشف عند فتح الأدوات (اختياري — ممكن يزعج) */
/* document.addEventListener("keydown", e=>{
    if(e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J"))){
        e.preventDefault();
    }
}); */

/* مسح الجلسة لو الصفحة اتقفلت لمدة */
window.addEventListener("beforeunload", ()=>{
    /* الجلسة موجودة في sessionStorage — بتتمسح لوحده لما تاب يتقفل */
});

</script>

</body>
</html>
